logging:
  level:
    org.springframework: DEBUG

spring:
  application:
    name: ms-account
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${db-url}
    username: ${db-username}
    password: ${db-password}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        default_schema: account
  config:
    import: "classpath:application-vault.yml,vault://"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer-uri}

server:
  port: 0

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: ${eureka-server}

management:
  endpoints:
    web:
      exposure:
        include: health,info

lib-auth-kyc:
  keycloak:
    server-url: ${kyc-server-url}
    realm: ${kyc-realm}
    client-id: ${kyc-client-id}
    client-secret: ${kyc-client-secret}
    cloudflare-access:
      client-id: ${cfa-client-id}
      client-secret: ${cfa-client-secret}
      enabled: true

